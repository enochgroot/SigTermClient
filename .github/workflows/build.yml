name: Build SigTermClient
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {java-version: '21', distribution: 'temurin'}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-build-cache build
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/SigTermClient-*.jar 2>/dev/null | grep -v sources | grep -v dev | head -1)
          echo "JAR: $JAR"
          if [ -n "$JAR" ]; then
            gh release delete v1.0.0 --yes 2>/dev/null || true
            gh release create v1.0.0 "$JAR" --title 'SigTerm Client v1.0.0' \
              --notes 'MC 1.21.11 utility client. RIGHT SHIFT to open GUI (rebindable).'
          fi
